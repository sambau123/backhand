<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b2f7a">
<title>BackhandVerse — Dunia 3D Servis Backhand Tahun 6</title>
<style>
:root{
  --blue:#194db8; --blue2:#2c6be0; --cyan:#35d8ff; --yellow:#ffe13f;
  --green:#39e28d; --red:#ff667d; --ink:#17305f; --glass:rgba(8,24,52,.82);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#071226;color:white}
#app{position:fixed;inset:0}
canvas{display:block}
.hud{position:absolute;z-index:20;inset:0;pointer-events:none}
.topbar{position:absolute;left:14px;right:14px;top:max(10px,env(safe-area-inset-top));display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.brand,.stats{pointer-events:auto}
.brand{padding:10px 14px;border-radius:18px;background:rgba(255,255,255,.92);color:#16346e;box-shadow:0 12px 35px rgba(0,0,0,.2)}
.brand b{display:block;font-size:20px} .brand span{font-size:11px;color:#58719d;font-weight:700}
.stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.stat{min-width:88px;padding:8px 10px;border-radius:15px;background:rgba(255,255,255,.93);color:#10274f;text-align:center;box-shadow:0 10px 28px rgba(0,0,0,.18)}
.stat small{display:block;color:#6a7fa3;font-size:9px;font-weight:900;letter-spacing:.08em}
.stat b{font-size:18px;color:#174cab}
.mission{position:absolute;left:50%;top:max(78px,calc(env(safe-area-inset-top) + 72px));transform:translateX(-50%);width:min(620px,86vw);padding:9px 13px;border-radius:999px;background:var(--glass);border:1px solid rgba(255,255,255,.13);text-align:center;font-size:12px;box-shadow:0 8px 26px rgba(0,0,0,.25)}
.mission b{color:var(--yellow)}
.prompt{position:absolute;left:50%;bottom:max(118px,calc(env(safe-area-inset-bottom) + 112px));transform:translateX(-50%);min-width:min(520px,88vw);text-align:center;padding:11px 14px;border-radius:18px;background:rgba(3,15,33,.86);border:1px solid rgba(92,220,255,.24);backdrop-filter:blur(10px);font-size:13px;opacity:0;transition:.2s}
.prompt.show{opacity:1}
.prompt strong{color:#5ee4ff}
.controls{position:absolute;z-index:25;inset:0;pointer-events:none}
.pad{position:absolute;left:18px;bottom:max(18px,env(safe-area-inset-bottom));width:150px;height:150px;pointer-events:auto}
.pad button,.actionBtns button{position:absolute;border:0;color:white;background:rgba(15,48,95,.78);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(8px);box-shadow:0 8px 20px rgba(0,0,0,.2);font-weight:900}
.pad button{width:48px;height:48px;border-radius:16px;font-size:19px}
#up{left:51px;top:0} #left{left:0;top:51px} #down{left:51px;top:102px} #right{left:102px;top:51px}
.actionBtns{position:absolute;right:18px;bottom:max(22px,env(safe-area-inset-bottom));width:190px;height:110px;pointer-events:auto}
.actionBtns button{border-radius:18px;padding:13px 15px}
#interact{right:0;bottom:0;background:linear-gradient(135deg,#ffc928,#ff9f22);color:#452c00;font-size:14px}
#lookL{left:0;top:0} #lookR{left:72px;top:0}
.help{position:absolute;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);font-size:10px;color:#c8daee;background:rgba(0,0,0,.25);padding:6px 9px;border-radius:999px}
.modal{position:fixed;z-index:50;inset:0;background:rgba(0,6,16,.76);backdrop-filter:blur(12px);display:none;place-items:center;padding:16px}
.modal.show{display:grid}
.card{width:min(760px,96vw);max-height:90vh;overflow:auto;background:linear-gradient(180deg,#ffffff,#eef5ff);color:#17305f;border-radius:28px;padding:22px;box-shadow:0 30px 100px rgba(0,0,0,.45)}
.card h2{margin:0 0 6px;color:#174cab;font-size:clamp(24px,4vw,38px)} .card p{line-height:1.55;color:#5b6f93}
.zoneTag{display:inline-flex;padding:6px 10px;border-radius:999px;background:#e7efff;color:#2754a9;font-size:11px;font-weight:900}
.close{float:right;border:0;border-radius:13px;background:#eaf0fb;color:#23477e;width:40px;height:40px;font-weight:900;font-size:18px;cursor:pointer}
.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
.pic{background:white;border:1px solid #dce6f5;border-radius:16px;overflow:hidden;box-shadow:0 8px 18px rgba(24,70,155,.08)}
.pic img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block} .pic b{display:block;padding:8px 9px;font-size:12px;color:#184ea8}
.btn{border:0;border-radius:14px;padding:11px 14px;font-weight:900;cursor:pointer;margin:4px 5px 0 0}
.primary{background:linear-gradient(135deg,#2154c3,#2f76ec);color:white} .yellow{background:#ffe13f;color:#554400} .ghost{background:#eaf1fd;color:#24509f}
.quizq{padding:12px 0;border-bottom:1px solid #dce6f5}
.quizq h4{margin:0 0 8px} .quizq button{display:block;width:100%;margin:6px 0;text-align:left;border:1px solid #d7e3f5;background:white;border-radius:12px;padding:10px;cursor:pointer;color:#27436f}
.quizq button.ok{background:#eafaf1;border-color:#6dd69f} .quizq button.bad{background:#fff0f2;border-color:#f08c9b}
.targetGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:430px;margin:16px auto}
.target{aspect-ratio:1.55;border:3px solid white;border-radius:12px;background:linear-gradient(135deg,#2f9c73,#1d745c);display:grid;place-items:center;font-size:26px;color:white;font-weight:1000;cursor:pointer;box-shadow:inset 0 0 0 2px rgba(255,255,255,.22)}
.target.goal{outline:5px solid rgba(255,225,63,.38)} .target.hit{background:#ffc926;color:#473800}
.checklist{display:grid;gap:8px;margin:14px 0} .check{display:flex;gap:10px;align-items:center;padding:10px;border-radius:12px;background:white;border:1px solid #dce6f5}
textarea{width:100%;min-height:90px;border-radius:14px;border:1px solid #d2deef;padding:12px;font:inherit}
.result{padding:12px;border-radius:14px;background:#ecf7ff;color:#25507d;margin-top:12px;display:none} .result.show{display:block}
.final{text-align:center} .final .big{font-size:64px}
@media(max-width:700px){
 .brand span{display:none} .brand b{font-size:16px} .stat{min-width:70px} .stats .stat:nth-child(2){display:none}
 .gallery{grid-template-columns:1fr 1fr} .help{display:none} .mission{top:72px}
}
</style>
</head>

<div id="app"></div>
<div class="hud">
  <div class="topbar">
    <div class="brand"><b>🏸 BackhandVerse</b><span>Dunia 3D Servis Backhand · Tahun 6</span></div>
    <div class="stats">
      <div class="stat"><small>MISI</small><b id="missionCount">0/6</b></div>

  <div class="mission">🎯 Misi: <b>Lengkapkan semua 6 zon pembelajaran</b> dan kuasai teknik servis backhand.</div>
  <div class="prompt" id="prompt">Tekan <strong>E / INTERAKSI</strong> untuk masuk zon.</div>
  <div class="help">Desktop: WASD bergerak · ← → pusing · E interaksi</div>

<div class="controls">
  <div class="pad">
    <button id="up">▲</button><button id="left">◀</button><button id="down">▼</button><button id="right">▶</button>

    <button id="interact">INTERAKSI ✨</button>

</div>

<div class="modal" id="modal">
  <div class="card" id="modalCard"></div>
</div>

function labelTexture(text,color="#ffffff",bg="#173d9a"){
 const c=document.createElement("canvas"); c.width=700;c.height=220; const x=c.getContext("2d");
 x.fillStyle=bg;x.roundRect(10,10,680,200,36);x.fill(); x.strokeStyle="rgba(255,255,255,.55)";x.lineWidth=6;x.stroke();

 const tex=new THREE.CanvasTexture(c);tex.colorSpace=THREE.SRGBColorSpace;return tex;
}
function makeZone(id,title,x,z,color){
 const g=new THREE.Group();g.position.set(x,0,z);
 const base=new THREE.Mesh(new THREE.CylinderGeometry(2.3,2.6,.6,20),new THREE.MeshStandardMaterial({color,metalness:.1,roughness:.45}));base.position.y=.3;base.castShadow=true;g.add(base);

 const beam=new THREE.Mesh(new THREE.CylinderGeometry(.65,1.25,5.2,18,1,true),new THREE.MeshBasicMaterial({color,transparent:true,opacity:.18,side:THREE.DoubleSide}));beam.position.y=3.1;g.add(beam);
 const plane=new THREE.Mesh(new THREE.PlaneGeometry(4.9,1.55),new THREE.MeshBasicMaterial({map:labelTexture(title),transparent:true,side:THREE.DoubleSide}));plane.position.y=4.9;g.add(plane);
 scene.add(g);return {id,title,group:g,position:new THREE.Vector3(x,0,z),done:false};
}

 makeZone(1,"1 · Kenali Teknik",-24,-17,0x2c6be0),
 makeZone(2,"2 · Susun Teknik",-24,17,0x8a5de8),
 makeZone(3,"3 · Kuiz Pintar",24,-17,0x13b7d6),
 makeZone(4,"4 · Target Challenge",24,17,0x28aa68),
 makeZone(5,"5 · Portal AR",0,-29,0xff9e2a),
 makeZone(6,"6 · Amali & Refleksi",0,31,0xe64f7b),
];

// Buildings / portals for visual interest
function kiosk(x,z,color){
 const g=new THREE.Group();g.position.set(x,0,z);
 const b=new THREE.Mesh(new THREE.BoxGeometry(6,3.2,4),new THREE.MeshStandardMaterial({color,roughness:.6}));b.position.y=1.6;b.castShadow=true;g.add(b);
 const roof=new THREE.Mesh(new THREE.ConeGeometry(4.3,1.6,4),new THREE.MeshStandardMaterial({color:0xffffff}));roof.position.y=4;roof.rotation.y=Math.PI/4;g.add(roof);scene.add(g);
}
kiosk(-35,0,0x7db1ef);kiosk(35,0,0xf7c95a);

// Camera follow
let yaw=Math.PI,keys={},nearZone=null;
function updateCamera(){
 const offset=new THREE.Vector3(0,4.4,7.8).applyAxisAngle(new THREE.Vector3(0,1,0),yaw);
 camera.position.lerp(player.position.clone().add(offset),.14);
 const look=player.position.clone().add(new THREE.Vector3(0,1.4,0));
 camera.lookAt(look);
 player.rotation.y=yaw+Math.PI;
}
function move(dt){
 const speed=7.3,rot=1.9;
 if(keys["ArrowLeft"])yaw+=rot*dt;if(keys["ArrowRight"])yaw-=rot*dt;
 let f=0,s=0;if(keys["w"]||keys["W"])f+=1;if(keys["s"]||keys["S"])f-=1;if(keys["a"]||keys["A"])s-=1;if(keys["d"]||keys["D"])s+=1;
 if(f||s){
  const dir=new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw)).multiplyScalar(-f);
  const side=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw)).multiplyScalar(s);
  dir.add(side).normalize().multiplyScalar(speed*dt);player.position.add(dir);
  player.position.x=THREE.MathUtils.clamp(player.position.x,-45,45);player.position.z=THREE.MathUtils.clamp(player.position.z,-45,45);
 }
}

function checkZones(){
 let best=null,d=999;
 zones.forEach(z=>{const nd=player.position.distanceTo(z.position);if(nd<d){d=nd;best=z}});
 if(d<5.2){nearZone=best;prompt.classList.add("show");prompt.innerHTML=`Anda berhampiran <strong>${best.title}</strong> · Tekan <strong>E / INTERAKSI</strong>`;zoneName.textContent=best.id;}
 else{nearZone=null;prompt.classList.remove("show");zoneName.textContent="Lobby";}
}

function completeZone(id,pts=100){
 const z=zones.find(z=>z.id===id);if(z&&!z.done){z.done=true;z.group.children[1].material.color.setHex(0x39e28d);state.score+=pts;}
 missionCount.textContent=zones.filter(z=>z.done).length+"/6";scoreEl.textContent=state.score;
 if(zones.every(z=>z.done))setTimeout(showFinal,500);
}

const state={score:0,quizCorrect:0,targetHits:0};

function showZone(z){
 if(!z)return;
 if(z.id===1)showTechnique();
 if(z.id===2)showSort();
 if(z.id===3)showQuiz();
 if(z.id===4)showTarget();
 if(z.id===5)showAR();
 if(z.id===6)showReflection();
}

function shell(tag,title,body){
 modalCard.innerHTML=`<button class="close" id="close">✕</button><span class="zoneTag">${tag}</span><h2>${title}</h2>${body}`;
 modal.classList.add("show");document.getElementById("close").onclick=()=>modal.classList.remove("show");
}

function showTechnique(){
 shell("ZON 1","Kenali 4 Langkah Teknik",`
 <p>Kenal pasti empat komponen utama servis backhand berdasarkan bahan pembelajaran kamu.</p>
 <div class="gallery">
   <div class="pic"><img src="${img1}"><b>1. Posisi Badan</b></div>
   <div class="pic"><img src="${img2}"><b>2. Pegangan Raket</b></div>
   <div class="pic"><img src="${img3}"><b>3. Ayunan Pendek</b></div>
   <div class="pic"><img src="${img4}"><b>4. Arah Sasaran</b></div>
 </div>
 <button class="btn primary" id="done1">Saya sudah kenal pasti ✓</button>`);
 document.getElementById("done1").onclick=()=>{completeZone(1,100);modal.classList.remove("show")};
}

function showSort(){
 shell("ZON 2","Susun 4 Langkah",`
 <p>Aktiviti drag-and-drop penuh sudah tersedia sebagai permainan berasingan.</p>
 <p><b>Urutan:</b> Posisi Badan → Pegangan Raket → Ayunan Pendek → Arah Sasaran.</p>
 <button class="btn yellow" id="openSort">🧩 Buka Aktiviti Susun Teknik</button>
 <button class="btn primary" id="done2">Tandakan zon selesai ✓</button>`);
 document.getElementById("openSort").onclick=()=>window.open("https://sambau123.github.io/backhand/susun_4_langkah_servis_backhand.html","_blank");
 document.getElementById("done2").onclick=()=>{completeZone(2,100);modal.classList.remove("show")};
}

function showQuiz(){
 shell("ZON 3","Kuiz Pintar",`
 <p>Jawab 3 soalan. Setiap jawapan betul memberikan mata tambahan.</p>
 <div id="quizBox"></div><div class="result" id="quizResult"></div>`);
 const qs=[
  ["Apakah langkah pertama servis backhand?",["Ayunan Pendek","Posisi Badan","Arah Sasaran"],1],
  ["Apakah jenis hayunan yang ditekankan?",["Ayunan pendek dan terkawal","Ayunan sangat panjang","Ayunan atas kepala"],0],
  ["Apakah fokus akhir servis?",["Penonton","Arah sasaran","Warna raket"],1]
 ];
 const qb=document.getElementById("quizBox");let answered=0,correct=0;
 qs.forEach((q,qi)=>{
   const d=document.createElement("div");d.className="quizq";d.innerHTML=`<h4>${qi+1}. ${q[0]}</h4>`;
   q[1].forEach((o,oi)=>{const b=document.createElement("button");b.textContent=o;b.onclick=()=>{if(d.dataset.done)return;d.dataset.done=1;[...d.querySelectorAll("button")].forEach((x,j)=>x.classList.add(j===q[2]?"ok":(j===oi?"bad":"")));if(oi===q[2])correct++;answered++;if(answered===qs.length){document.getElementById("quizResult").classList.add("show");document.getElementById("quizResult").innerHTML=`Skor kuiz: <b>${correct}/3</b> <button class="btn primary" id="finishQuiz">Selesai</button>`;document.getElementById("finishQuiz").onclick=()=>{state.score+=correct*30;completeZone(3,100);modal.classList.remove("show")}}};d.appendChild(b);});qb.appendChild(d);
 });
}

function showTarget(){
 const goal=Math.floor(Math.random()*4);
 shell("ZON 4","Target Challenge",`
 <p>Cabaran: pilih <b>Zon ${goal+1}</b> pada gelanggang.</p>
 <div class="targetGrid">${[0,1,2,3].map(i=>`<div class="target ${i===goal?'goal':''}" data-i="${i}">${i+1}</div>`).join("")}</div>
 <div class="result" id="targetResult"></div>`);
 document.querySelectorAll(".target").forEach(t=>t.onclick=()=>{const ok=Number(t.dataset.i)===goal;t.classList.add("hit");const r=document.getElementById("targetResult");r.classList.add("show");r.innerHTML=ok?`✅ Tepat! Anda memilih ruang sasaran yang betul. <button class="btn primary" id="finishTarget">Selesai</button>`:`❌ Belum tepat. Cuba pilih Zon ${goal+1}.`;if(ok)document.getElementById("finishTarget").onclick=()=>{completeZone(4,130);modal.classList.remove("show")}});
}

function showAR(){
 shell("ZON 5","Portal Permainan AR",`
 <p>Gunakan kamera untuk bermain permainan AR servis backhand yang telah dibina.</p>
 <button class="btn yellow" id="openAR">🎮 Buka Backhand Target AR</button>
 <button class="btn primary" id="done5">Tandakan zon selesai ✓</button>`);
 document.getElementById("openAR").onclick=()=>window.open("https://sambau123.github.io/backhand/","_blank");
 document.getElementById("done5").onclick=()=>{completeZone(5,120);modal.classList.remove("show")};
}

function showReflection(){
 shell("ZON 6","Cabaran Amali & Refleksi",`
 <p><b>Simulasi PdP:</b> Lakukan 5 percubaan servis backhand ke ruang sasaran. Tandakan pencapaian anda.</p>
 <div class="checklist">
  ${[1,2,3,4,5].map(i=>`<label class="check"><input type="checkbox" class="serveCheck"> Percubaan ${i} berjaya ke ruang sasaran</label>`).join("")}
 </div>
 <p><b>Refleksi:</b> Apakah satu aspek yang ingin anda perbaiki?</p>
 <textarea id="reflection" placeholder="Contoh: Saya perlu mengawal ayunan supaya lebih pendek dan tepat."></textarea>
 <button class="btn primary" id="finishRef">Hantar Refleksi</button>
 <div class="result" id="refResult"></div>`);
 document.getElementById("finishRef").onclick=()=>{const n=[...document.querySelectorAll(".serveCheck")].filter(x=>x.checked).length;const tx=document.getElementById("reflection").value.trim();const r=document.getElementById("refResult");r.classList.add("show");r.innerHTML=`Rekod simulasi: <b>${n}/5</b> servis berjaya.${tx?`<br>Refleksi: “${tx}”`:"<br>Sila tulis satu refleksi ringkas."}`;if(tx){completeZone(6,150);setTimeout(()=>modal.classList.remove("show"),1200)}};
}

function showFinal(){
 shell("MISI LENGKAP","Tahniah, Backhand Explorer! 🎉",`
 <div class="final"><div class="big">🏆</div><p>Anda telah melengkapkan semua 6 zon pembelajaran BackhandVerse.</p><h3>Skor akhir: ${state.score}</h3>
 <p>Urutan yang perlu diingati:</p><p><b>Posisi Badan → Pegangan Raket → Ayunan Pendek → Arah Sasaran</b></p>
 <button class="btn primary" id="closeFinal">Kembali ke dunia 3D</button></div>`);
 document.getElementById("closeFinal").onclick=()=>modal.classList.remove("show");
}

addEventListener("keydown",e=>{keys[e.key]=true;if((e.key==="e"||e.key==="E")&&nearZone)showZone(nearZone);});
addEventListener("keyup",e=>keys[e.key]=false);

function bindHold(id,key){
 const el=document.getElementById(id);
 const on=e=>{e.preventDefault();keys[key]=true};const off=e=>{e.preventDefault();keys[key]=false};
 ["pointerdown","touchstart"].forEach(ev=>el.addEventListener(ev,on,{passive:false}));
 ["pointerup","pointercancel","touchend","touchcancel"].forEach(ev=>el.addEventListener(ev,off,{passive:false}));
}
bindHold("up","w");bindHold("down","s");bindHold("left","a");bindHold("right","d");bindHold("lookL","ArrowLeft");bindHold("lookR","ArrowRight");
document.getElementById("interact").onclick=()=>nearZone&&showZone(nearZone);

let last=performance.now();
function animate(now){
 const dt=Math.min(.04,(now-last)/1000);last=now;move(dt);updateCamera();checkZones();renderer.render(scene,camera);requestAnimationFrame(animate);
}
updateCamera();requestAnimationFrame(animate);

addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

// start guide
setTimeout(()=>{
 shell("SELAMAT DATANG","Masuk ke BackhandVerse 🏸",`
 <p>Bergerak dalam dunia 3D dan lawati <b>6 zon pembelajaran</b>. Setiap zon mewakili satu pengalaman dalam Model ASSURE.</p>
 <p><b>Telefon:</b> gunakan butang arah di kiri, butang ↶ ↷ untuk pusing, dan <b>INTERAKSI</b> apabila dekat dengan zon.</p>
 <p><b>Komputer:</b> WASD untuk bergerak, anak panah kiri/kanan untuk pusing, dan E untuk interaksi.</p>
 <button class="btn primary" id="startWorld">Mula Teroka</button>`);
 document.getElementById("startWorld").onclick=()=>modal.classList.remove("show");
},350);
</script>
